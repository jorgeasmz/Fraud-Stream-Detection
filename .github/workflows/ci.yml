name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: fraud
          POSTGRES_PASSWORD: fraud
          POSTGRES_DB: fraud
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U fraud"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest
      # The schema declares indexes and a unique constraint the offline suite cannot
      # exercise, so the migration is applied and the dialect-specific tests run.
      - run: alembic upgrade head
      - run: pytest -m postgres --no-cov

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          # Read from .nvmrc, so CI resolves the dependency tree with the same npm
          # that wrote the lock file. A different major rejects it as out of sync.
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
